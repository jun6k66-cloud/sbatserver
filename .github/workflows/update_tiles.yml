name: Update Minecraft Map Tiles

on:
  workflow_dispatch: # 수동 실행
  schedule:
    - cron: '*/30 * * * *' # 30분마다 자동 실행

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. 깃허브 저장소의 기존 파일들(이전에 올려둔 타일들)을 완벽히 가져옴
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 기존 파일들의 타임스탬프와 이력을 보존하여 비교 정확도 향상

      # 2. lftp 설치
      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      # 3. 변경되거나 추가된 타일만 스마트하게 동기화
      - name: Download Tiles via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          mkdir -p ./tiles
          lftp -u "$SFTP_USER","$SFTP_PASS" -p "$SFTP_PORT" sftp://"$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 5
          set net:reconnect-interval-base 5
          
          # 전송 중 크기 변경 에러 무시 및 강제 종료 방지
          set xfer:verify-file-size no
          set cmd:fail-exit no
          
          # [핵심] 
          # --only-newer : 서버의 수정 시간이 로컬보다 더 최신인 파일만 다운로드
          # --ignore-time 옵션은 절대 넣지 않아야 날짜/시간 기반으로 차이점만 골라냄
          mirror --verbose --continue --only-newer --parallel=5 \
            --exclude-glob "*players*.json" \
            /config/pl3xmap/web/tiles/ ./tiles/
          quit
          EOF

      # 4. 변경된 파일이 있을 때만 푸시
      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          git add tiles/
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "✨ 변경된 타일이 발견되어 업데이트합니다."
            git commit -m "🤖 정기 타일 업데이트 ($(date +'%Y-%m-%d %H:%M:%S'))"
            git config http.postBuffer 524288000
            git push origin main
          else
            echo "✅ 변경되거나 새로 추가된 타일이 없습니다. 다운로드를 스킵합니다."
          fi
