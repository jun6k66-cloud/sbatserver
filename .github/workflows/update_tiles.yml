name: Update Minecraft Map Tiles

on:
  workflow_dispatch: # 수동 실행
  schedule:
    # ⚠️ 중요: 깃허브 액션은 3분 주기를 지원하지 않거나 임의로 차단합니다. 
    # 최소 15분 이상, 권장 30분 단위로 설정해야 안정적으로 작동합니다.
    - cron: '*/30 * * * *' # 30분마다 자동 실행

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 타일 양이 많아져서 15분을 초과하면 강제 종료됩니다.

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # 속도 향상을 위해 최근 커밋만 가져옴

      # 리눅스 표준 SFTP 툴(lftp) 설치
      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      # 안정적인 타일 동기화 (오류 발생 시 재시도 로직 강화)
      - name: Download Tiles via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          mkdir -p ./tiles
          lftp -u "$SFTP_USER","$SFTP_PASS" -p "$SFTP_PORT" sftp://"$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 5
          set net:reconnect-interval-base 5
          # --parallel=5 로 늘려 다운로드 속도 향상, 변경되거나 새로 생긴 파일만 가져옴
          mirror --verbose --continue --only-newer --parallel=5 /config/pl3xmap/web/tiles/ ./tiles/
          quit
          EOF

      # 변경 사항 커밋 및 푸시 (오류 방지 로직 추가)
      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 타일 폴더를 git에 추가
          git add tiles/
          
          # 변경 사항이 있는지 명확하게 체크 후 커밋/푸시
          if [ -n "$(git status --porcelain)" ]; then
            echo "변경사항이 발견되어 커밋을 진행합니다."
            git commit -m "🤖 정기 타일 업데이트 ($(date +'%Y-%m-%d %H:%M:%S'))"
            
            # 대용량 커밋 시 터지는 문제를 방지하기 위해 버퍼 크기 확장 후 푸시
            git config http.postBuffer 524288000
            git push origin main
          else
            echo "업데이트된 타일 파일이 없습니다. 작업을 종료합니다."
          fi
